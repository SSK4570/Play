name: Build NEX PLAYER+

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/NexPlayer-Plus-debug.apk 2>/dev/null || true
          mv app/build/outputs/apk/release/app-release-unsigned.apk \
             app/build/outputs/apk/release/NexPlayer-Plus-release-unsigned.apk 2>/dev/null || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NexPlayer-Plus-Debug
          path: app/build/outputs/apk/debug/NexPlayer-Plus-debug.apk
          retention-days: 30

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: NexPlayer-Plus-Release-Unsigned
          path: app/build/outputs/apk/release/NexPlayer-Plus-release-unsigned.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: gradle assembleRelease
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Rename APK for release
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          mv app/build/outputs/apk/release/app-release-unsigned.apk \
             "app/build/outputs/apk/release/NexPlayer-Plus-${TAG}-unsigned.apk" || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: NEX PLAYER+ ${{ github.ref_name }}
          body: |
            ## NEX PLAYER+ ${{ github.ref_name }}

            ### Installation
            1. Download `NexPlayer-Plus-*-unsigned.apk` below
            2. Enable "Install from unknown sources" in Android Settings → Security
            3. Install the APK
            4. Open NEX PLAYER+ and add your M3U playlist URL

            ### Requirements
            - Android 5.0 (API 21) or higher
            - Your own IPTV/M3U playlist URL

            > This APK is unsigned — no keystore required.
          files: |
            app/build/outputs/apk/release/NexPlayer-Plus-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
